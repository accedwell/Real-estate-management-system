# Render Blueprint: one Docker web service + one PostgreSQL database.
# In Render: New > Blueprint > pick this repository > Apply.
services:
  - type: web
    name: rems
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /index.jsp
    envVars:
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: rems-db
          property: connectionString
      # Random admin password, generated once by Render. Find it under
      # rems > Environment. It replaces the demo password for admin@rems.co.za.
      - key: REMS_ADMIN_PASSWORD
        generateValue: true

databases:
  - name: rems-db
    plan: free
    databaseName: rems
    user: rems
